name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build
        run: deno task build

      - name: Package
        run: |
          set -euo pipefail
          NAME=$(grep -m1 '^identifier *=' orax.toml | sed -E 's/^identifier *= *"(.*)"/\1/')
          FILE="${NAME}-${GITHUB_REF_NAME}.orax"
          zip -j "$FILE" orax.toml dist/main.js logo.svg README.md
          SHA256=$(sha256sum "$FILE" | awk '{print $1}')
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${FILE}"
          {
            printf 'url = "%s"\nsha256 = "%s"\n\n' "$URL" "$SHA256"
            cat orax.toml
          } > manifest.toml
          echo "ORAX_FILE=$FILE" >> "$GITHUB_ENV"

      - name: Create Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${ORAX_FILE}" manifest.toml \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
